services:
  - type: web
    name: trill-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health/live
    disk:
      name: trill-audio
      mountPath: /app/audio_output
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ACESTEP_API_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: AUDIO_OUTPUT_DIR
        value: /app/audio_output
